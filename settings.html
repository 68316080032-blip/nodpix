<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าบัญชี | VG HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Lato', 'Poppins', 'Noto Sans Thai', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-rose-500">VG HUB</span>
                <span class="text-[10px] bg-slate-100 font-bold px-2 py-0.5 rounded-md text-slate-500 uppercase tracking-tight">Settings</span>
            </div>
            <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors flex items-center space-x-1">
                <span>⬅️</span> <span>กลับหน้าหลัก</span>
            </a>
        </div>
    </nav>

    <main class="max-w-xl mx-auto w-full px-4 py-12 flex-grow">
        <div class="bg-white border border-slate-100 shadow-xl rounded-3xl p-6 md:p-8 space-y-6 relative overflow-hidden">
            
            <div class="border-b border-slate-100 pb-4">
                <h1 class="text-xl font-black text-slate-800 tracking-tight">⚙️ ตั้งค่าโปรไฟล์ครีเอเตอร์</h1>
                <p class="text-xs text-slate-400 mt-1">ข้อมูลเหล่านี้จะไปปรากฏเมื่อมีผู้ใช้งานคลิกดูช่องทางติดต่อและคอมเมนต์ของคุณ</p>
            </div>

            <div class="flex flex-col items-center space-y-3 bg-slate-50/50 p-4 rounded-2xl border border-slate-100">
                <div id="avatar-preview-box" class="w-20 h-20 bg-orange-500 text-white font-black text-2xl rounded-full overflow-hidden flex items-center justify-center border-2 border-orange-500/10 shadow-sm">
                    -
                </div>
                <div class="text-center">
                    <span id="display-email" class="text-xs font-mono font-bold text-slate-400">loading...</span>
                </div>
            </div>

            <form id="settings-form" class="space-y-4">
                
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">ชื่อเล่น หรือ ชื่อในการทำงาน (Display Name)</label>
                    <input type="text" id="input-name" placeholder="เช่น Graphic_Boy, EditorPro" class="w-full bg-slate-50 text-xs px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all font-bold text-slate-700" required>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">รูปโปรไฟล์ (Upload Avatar Image)</label>
                    <div class="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <input type="file" id="input-avatar-file" accept="image/*" class="text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100 cursor-pointer">
                    </div>
                    <input type="hidden" id="input-avatar">
                    <p class="text-[10px] text-slate-400 leading-normal">รองรับการเลือกไฟล์ภาพถ่ายจากโทรศัพท์และคอมพิวเตอร์ของคุณ ระบบจะเชื่อมต่อกับแดชบอร์ดโดยตรง</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">เบอร์โทรศัพท์ติดต่อ (Phone)</label>
                        <input type="tel" id="input-phone" placeholder="เช่น 0987654321" class="w-full bg-slate-50 text-xs px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all font-mono font-bold text-slate-700">
                    </div>

                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block">ไอดีไลน์ (LINE ID)</label>
                        <input type="text" id="input-line" placeholder="เช่น line_id_123" class="w-full bg-slate-50 text-xs px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all font-bold text-slate-700">
                    </div>
                </div>

                <div class="pt-4 flex space-x-3">
                    <a href="index.html" class="w-1/3 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-xl transition-all text-center">
                        ยกเลิก
                    </a>
                    <button type="submit" id="btn-submit-save" class="w-2/3 py-3 bg-gradient-to-r from-orange-500 to-rose-500 text-white text-xs font-bold rounded-xl shadow-md shadow-orange-500/10 hover:opacity-95 transition-all active:scale-[0.99]">
                        💾 บันทึกข้อมูลโปรไฟล์
                    </button>
                </div>

            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 text-center py-4 text-[11px] text-slate-400 font-medium">
        <p>© 2026 VG HUB. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { db, auth } from "./firebase-config.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let currentUid = null;

        // 1. ตรวจสอบสถานะการ Login และดึงข้อมูลเดิมมาป้อนลงฟอร์ม
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                alert("🔒 กรุณาเข้าสู่ระบบก่อนทำการตั้งค่าโปรไฟล์ครับ");
                window.location.href = "login.html";
                return;
            }

            currentUid = user.uid;
            document.getElementById("display-email").innerText = user.email;

            try {
                const userDoc = await getDoc(doc(db, "users", currentUid));
                if (userDoc.exists()) {
                    const uData = userDoc.data();
                    
                    document.getElementById("input-name").value = uData.name || uData.displayName || "";
                    // ดึงค่าลิงก์รูปภาพเดิมจากฟิลด์ใดฟิลด์หนึ่งที่เจอก่อน
                    const existingAvatar = uData.avatarUrl || uData.avatar || uData.photoURL || "";
                    document.getElementById("input-avatar").value = existingAvatar;
                    
                    document.getElementById("input-phone").value = uData.phone || uData.tel || "";
                    document.getElementById("input-line").value = uData.line || uData.lineId || "";

                    updateAvatarPreview(uData.name || "U", existingAvatar);
                } else {
                    updateAvatarPreview(user.email.charAt(0).toUpperCase(), "");
                }
            } catch (err) {
                console.error("Error loading profile data:", err);
            }
        });

        // ฟังก์ชันอัปเดตรูป Preview ด้านบน
        function updateAvatarPreview(name, url) {
            const previewBox = document.getElementById("avatar-preview-box");
            if (!previewBox) return;
            if (url) {
                previewBox.innerHTML = `<img src="${url}" class="w-full h-full object-cover" onerror="this.parentNode.innerText='${name.charAt(0).toUpperCase()}';">`;
            } else {
                previewBox.innerHTML = "";
                previewBox.innerText = name.charAt(0).toUpperCase();
            }
        }

        // ตัวตรวจจับเมื่อมีการเลือกไฟล์ภาพใหม่ ให้เปลี่ยนรูปพรีวิวให้เห็นทันทีก่อนกดเซฟ
        document.getElementById("input-avatar-file").onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    updateAvatarPreview("✏️", event.target.result);
                };
                reader.readAsDataURL(file);
            }
        };

        // 2. ฟังก์ชันหลักเมื่อผู้ใช้กดปุ่มบันทึกโปรไฟล์
        const form = document.getElementById("settings-form");
        if (form) {
            form.onsubmit = async (e) => {
                e.preventDefault();
                if (!currentUid) return;

                const saveBtn = document.getElementById("btn-submit-save");
                saveBtn.innerText = "กำลังบันทึกข้อมูล... ⏳";
                saveBtn.disabled = true;

                let finalAvatarUrl = document.getElementById("input-avatar").value;
                const fileInput = document.getElementById("input-avatar-file");

                // หากมีการเลือกไฟล์รูปภาพมาใหม่ แปลงมันเป็นข้อความ Base64 สตริงเดี่ยว
                if (fileInput && fileInput.files.length > 0) {
                    try {
                        finalAvatarUrl = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (event) => resolve(event.target.result);
                            reader.onerror = (error) => reject(error);
                            reader.readAsDataURL(fileInput.files[0]);
                        });
                    } catch (err) {
                        console.error("Base64 Conversion Error:", err);
                    }
                }

                // ⚡ [จุดสำคัญ] เตรียมชุดข้อมูลโดยกระจายใส่ตัวแปรทุกชื่อเพื่อลิงก์หาแดชบอร์ดให้เจอชัวร์ๆ
                const updatedData = {
                    name: document.getElementById("input-name").value.trim(),
                    displayName: document.getElementById("input-name").value.trim(), // เพิ่มฟิลด์เสริมแดชบอร์ดเก่า
                    
                    // กระจายส่งลิงก์รูปภาพไปทุกชื่อฟิลด์ยอดฮิต ป้องกันแดชบอร์ดจำหน้าสับสนครับ
                    avatarUrl: finalAvatarUrl, 
                    avatar: finalAvatarUrl,
                    photoURL: finalAvatarUrl,
                    
                    phone: document.getElementById("input-phone").value.trim(),
                    line: document.getElementById("input-line").value.trim(),
                    updatedAt: new Date().toISOString()
                };

                try {
                    // เซฟทับข้อมูลเดิมลง Firestore ตาราง users
                    await setDoc(doc(db, "users", currentUid), updatedData, { merge: true });
                    
                    alert("🎉 อัปโหลดรูปภาพและบันทึกโปรไฟล์เรียบร้อยแล้วครับ!");
                    window.location.href = "index.html"; // เซฟเสร็จส่งกลับแดชบอร์ดหลักทันที
                } catch (err) {
                    console.error("Firestore Save Error:", err);
                    alert("ล้มเหลวในการบันทึกข้อมูล: " + err.message);
                    saveBtn.innerText = "💾 บันทึกข้อมูลโปรไฟล์";
                    saveBtn.disabled = false;
                }
            };
        }
    </script>
</body>
</html>
