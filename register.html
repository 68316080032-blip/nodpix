<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODPIX | สมัครสมาชิกใหม่</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Lato', 'Noto Sans Thai', sans-serif; }
    </style>
</head>
<body class="bg-[#121212] text-zinc-100 antialiased min-h-screen flex flex-col justify-between p-4 relative overflow-x-hidden">

    <!-- Background Glow Effect -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-orange-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Header / Brand -->
    <header class="w-full max-w-md mx-auto pt-4 flex justify-between items-center z-10">
        <a href="index.html" class="text-xl font-black tracking-tight text-white hover:opacity-90 transition-all flex items-center gap-1">
            NODPIX
        </a>
        <a href="index.html" class="text-xs text-zinc-400 hover:text-white transition-all flex items-center gap-1">
            ✕ ปิด
        </a>
    </header>

    <!-- Main Register Card -->
    <main class="w-full max-w-md mx-auto my-auto bg-[#191919]/80 backdrop-blur-md rounded-3xl p-8 border border-white/10 shadow-2xl relative z-10 space-y-6">
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-black tracking-tight text-white uppercase">Create Account</h1>
            <p class="text-xs text-zinc-400">ร่วมเป็นส่วนหนึ่งของคอมมูนิตี้ครีเอเตอร์ NODPIX</p>
        </div>

        <hr class="border-white/10">

        <form id="form-register" class="space-y-4">
            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">ชื่อ-นามสกุล / นามแฝง</label>
                <input type="text" id="reg-name" placeholder="เช่น Somchai Creative" class="w-full bg-white/5 text-zinc-100 text-xs px-4 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:bg-white/10 focus:border-orange-500 transition-all placeholder:text-zinc-600" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">เบอร์โทรศัพท์</label>
                    <input type="tel" id="reg-phone" placeholder="08X-XXXXXXX" class="w-full bg-white/5 text-zinc-100 text-xs px-4 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:bg-white/10 focus:border-orange-500 transition-all placeholder:text-zinc-600" required>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">LINE ID</label>
                    <input type="text" id="reg-line" placeholder="Line_ID" class="w-full bg-white/5 text-zinc-100 text-xs px-4 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:bg-white/10 focus:border-orange-500 transition-all placeholder:text-zinc-600" required>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">อีเมล (Email)</label>
                <input type="email" id="reg-email" placeholder="example@nodpix.com" class="w-full bg-white/5 text-zinc-100 text-xs px-4 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:bg-white/10 focus:border-orange-500 transition-all placeholder:text-zinc-600" required>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold uppercase tracking-wider text-zinc-400">รหัสผ่าน (Password)</label>
                <input type="password" id="reg-password" placeholder="อย่างน้อย 6 ตัวอักษร" class="w-full bg-white/5 text-zinc-100 text-xs px-4 py-2.5 rounded-xl border border-white/10 focus:outline-none focus:bg-white/10 focus:border-orange-500 transition-all placeholder:text-zinc-600" required>
            </div>

            <button type="submit" class="w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl text-xs font-bold shadow-lg shadow-orange-500/20 transition-all uppercase tracking-wider active:scale-[0.99] mt-2">
                Sign Up / สมัครสมาชิก
            </button>
        </form>

        <div class="text-center pt-2 border-t border-white/10">
            <p class="text-xs text-zinc-400 font-medium">มีบัญชีอยู่แล้วใช่ไหม? <a href="login.html" class="text-orange-500 hover:underline font-bold ml-1 transition-colors">เข้าสู่ระบบที่นี่</a></p>
        </div>
    </main>

    <footer class="w-full text-center py-4 text-[11px] text-zinc-600">
        &copy; NODPIX Community. All rights reserved.
    </footer>

    <script type="module" src="./js/register.js"></script>
</body>
</html>
