<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODPIX | Explore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Lato', 'Noto Sans Thai', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f9f9f9] text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-[#191919]/80 backdrop-blur-md text-white sticky top-0 z-50 px-4 sm:px-6 py-2.5 flex items-center justify-between border-b border-white/10 text-xs sm:text-sm font-semibold transition-all">
        <div class="flex items-center space-x-4 sm:space-x-6">
            <a href="index.html" class="text-base sm:text-lg font-black tracking-tight text-white hover:opacity-90 transition-all flex items-center gap-1">
                NODPIX
            </a>

            <nav class="hidden lg:flex items-center space-x-5 text-zinc-300">
                <a href="index.html" class="text-white font-bold border-b-2 border-orange-500 pb-0.5">Explore</a>
                <a href="jobs.html" class="hover:text-white transition-all">Jobs</a>
                <!-- 🔒 ปรับให้เช็กการเข้าสู่ระบบก่อนเปิดดูโปรไฟล์ -->
                <button type="button" onclick="checkAuthAndNavigate('profile.html')" class="hover:text-white transition-all flex items-center gap-1 text-orange-500 font-bold focus:outline-none">
                    <span>+ Profile</span>
                </button>
            </nav>
        </div>

        <div class="flex-1 max-w-xl mx-4 hidden sm:block">
            <div class="relative flex items-center w-full bg-white/10 rounded-full border border-white/5 focus-within:bg-white/20 focus-within:ring-1 focus-within:ring-orange-500/50 transition-all px-3 py-1">
                <svg class="w-4 h-4 text-zinc-400 shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" 
                       id="search-input"
                       placeholder="Search NODPIX..." 
                       class="w-full bg-transparent text-zinc-100 placeholder-zinc-400 text-xs px-3 py-1 focus:outline-none">
                
                <div class="hidden md:flex items-center space-x-1 text-[11px] font-bold text-zinc-400 border-l border-white/10 pl-2 shrink-0">
                    <button type="button" class="px-2 py-0.5 hover:text-white rounded-md transition-all text-white bg-white/10">Projects</button>
                    <button type="button" class="px-2 py-0.5 hover:text-white rounded-md transition-all">Assets</button>
                    <button type="button" class="px-2 py-0.5 hover:text-white rounded-md transition-all">Images</button>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: โปรไฟล์ Dropdown -->
        <div class="flex items-center space-x-3 sm:space-x-4">
            <div id="auth-guest" class="flex items-center space-x-2">
                <a href="login.html" class="px-4 py-1.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-full transition-all shadow-md shadow-orange-500/20">Sign In</a>
            </div>

            <div id="auth-user" class="hidden flex items-center space-x-3 sm:space-x-4">
                <a href="create-work.html" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-4 py-1.5 rounded-full transition-all flex items-center gap-1.5 shadow-md shadow-orange-500/20 active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    <span class="hidden sm:inline">Share Work</span>
                </a>

                <div class="relative profile-dropdown-wrapper py-1 z-50">
                    <button type="button" id="btn-toggle-dropdown" class="w-8 h-8 rounded-full overflow-hidden border border-white/20 cursor-pointer bg-zinc-800 flex items-center justify-center shrink-0 focus:outline-none">
                        <img id="header-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="Profile" class="w-full h-full object-cover">
                    </button>

                    <div id="user-dropdown-menu" class="hidden absolute right-0 top-full pt-2 w-64 z-50">
                        <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden text-slate-800 relative">
                            <div class="w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[6px] border-b-white absolute top-[-6px] right-3"></div>
                            
                            <div class="max-h-[85vh] overflow-y-auto p-4 space-y-3.5 text-xs font-semibold select-none">
                                <div class="flex flex-col items-center text-center pb-3 border-b border-slate-100">
                                    <img id="dropdown-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" class="w-16 h-16 rounded-full object-cover mb-2 border-2 border-slate-100">
                                    <h3 id="dropdown-user-name" class="text-sm font-bold text-slate-900 truncate max-w-full">กำลังโหลด...</h3>
                                    <p id="dropdown-user-email" class="text-[11px] text-slate-400 font-normal truncate max-w-full">user@email.com</p>
                                </div>

                                <div class="p-2.5 rounded-xl bg-slate-50 text-slate-500 text-[11px] text-center">
                                    Viewing as: <strong class="text-slate-800">Creative</strong>
                                </div>

                                <ul class="space-y-2.5 pt-1 text-slate-700">
                                    <li>
                                        <a href="create-work.html" class="flex items-center gap-2 text-orange-600 font-bold hover:underline">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                            สร้างผลงานใหม่
                                        </a>
                                    </li>
                                    <li>
                                        <button type="button" onclick="checkAuthAndNavigate('profile.html')" class="block w-full text-left hover:text-orange-600">Profile</button>
                                    </li>
                                    <li><a href="settings.html" class="block hover:text-orange-600">Settings</a></li>
                                </ul>

                                <hr class="border-slate-100">

                                <button id="dropdown-logout" type="button" class="w-full text-left text-rose-500 font-bold hover:underline pt-0.5">
                                    Sign Out
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 🏷️ Category Sub-header -->
    <div class="bg-white border-b border-slate-200 sticky top-[49px] z-40 px-4 sm:px-6 py-3">
        <div class="max-w-[1800px] mx-auto flex items-center justify-between gap-4 overflow-x-auto no-scrollbar">
            <div class="flex items-center space-x-2 shrink-0">
                <button type="button" data-filter="all" class="filter-btn px-4 py-2 bg-orange-500 text-white rounded-full text-xs font-bold transition-all shadow-xs shadow-orange-500/30">For You</button>
                <button type="button" data-filter="Graphic Design" class="filter-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-bold transition-all">Graphic Design</button>
                <button type="button" data-filter="Photography" class="filter-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-bold transition-all">Photography</button>
                <button type="button" data-filter="Illustration" class="filter-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-bold transition-all">Illustration</button>
                <button type="button" data-filter="3D Art" class="filter-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-bold transition-all">3D Art</button>
                <button type="button" data-filter="UI/UX" class="filter-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-bold transition-all">UI/UX</button>
                <button type="button" data-filter="Motion" class="filter-btn px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-xs font-bold transition-all">Motion</button>
            </div>

            <div class="flex items-center space-x-3 shrink-0 text-xs font-bold text-slate-500">
                <span>Sorted by:</span>
                <select id="sort-select" class="bg-slate-100 border-none rounded-lg px-3 py-1.5 text-xs font-bold text-slate-800 focus:outline-none cursor-pointer">
                    <option value="recommended">Recommended</option>
                    <option value="latest">Latest</option>
                    <option value="popular">Most Liked</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 🎨 Main Grid Feed Zone -->
    <main class="max-w-[1800px] mx-auto w-full px-4 sm:px-6 py-8 flex-grow">
        <div id="main-portfolio-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- Dynamic Content -->
        </div>
        <div id="pagination-controls" class="flex justify-center items-center space-x-2 mt-12"></div>
    </main>

    <!-- 🔍 MODAL VIEW PORTFOLIO -->
    <div id="portfolio-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col md:flex-row shadow-2xl relative">
            <button id="modal-close-btn" class="absolute top-4 right-4 z-10 w-9 h-9 bg-black/50 hover:bg-black text-white rounded-full flex items-center justify-center transition-all">✕</button>

            <!-- ฝั่งซ้าย: พื้นที่แสดงภาพและสื่อ -->
            <div class="md:w-3/5 bg-zinc-900 flex items-center justify-center p-4 min-h-[300px] max-h-[60vh] md:max-h-[90vh]">
                <img id="modal-img" src="" class="hidden max-w-full max-h-full object-contain rounded-xl block mx-auto">
                <video id="modal-video" src="" class="hidden w-full h-full object-contain bg-zinc-900 border-0 rounded-xl" controls autoplay></video>
                <iframe id="modal-iframe" src="" class="hidden w-full h-full object-contain bg-zinc-900 border-0 aspect-video rounded-xl" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            </div>

            <!-- ฝั่งขวา: รายละเอียด & คอมเมนต์ -->
            <div class="md:w-2/5 p-6 flex flex-col justify-between overflow-y-auto max-h-[50vh] md:max-h-[90vh] bg-white">
                <div>
                    <span id="modal-category" class="text-[10px] font-black text-orange-600 uppercase tracking-widest bg-orange-50 px-2.5 py-1 rounded-md inline-block mb-2">CATEGORY</span>
                    <h2 id="modal-title" class="text-xl font-extrabold text-zinc-900 leading-snug">Title</h2>
                    <p id="modal-desc" class="text-xs text-zinc-500 mt-2 leading-relaxed">Description...</p>

                    <div id="modal-internal-creator-block"></div>

                    <div class="mt-4 pt-4 border-t border-zinc-100 flex items-center justify-between">
                        <button id="modal-like-btn" class="flex items-center space-x-2 bg-orange-50 hover:bg-orange-100 text-orange-600 px-4 py-2 rounded-full font-bold text-xs transition-all">
                            <span>ถูกใจ</span>
                            <span id="modal-like-count" class="bg-orange-500 text-white px-2 py-0.5 rounded-full text-[10px]">0</span>
                        </button>
                    </div>

                    <div class="mt-6">
                        <h4 class="text-xs font-bold text-zinc-700 mb-2">Comments (<span id="modal-comment-count">0</span>)</h4>
                        <div id="modal-comments-container" class="space-y-2 max-h-40 overflow-y-auto pr-1 text-xs"></div>
                    </div>
                </div>

                <form id="modal-comment-form" class="mt-4 pt-3 border-t border-zinc-100 flex gap-2">
                    <input type="text" id="modal-comment-input" placeholder="แสดงความคิดเห็น..." class="flex-1 bg-zinc-100 text-xs px-3 py-2 rounded-xl focus:outline-none focus:bg-white focus:border focus:border-orange-500">
                    <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all">ส่ง</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ⚡ Script หลักของระบบ App -->
    <script type="module" src="./js/app.js"></script>

    <!-- ⚡ Script สำหรับ Auth, Filter UI, Search & Global Handlers -->
    <script type="module">
        import { auth, db } from "./js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔒 ฟังก์ชันสำหรับตรวจสอบสถานะการเข้าสู่ระบบก่อนเปิดหน้าโปรไฟล์
        window.checkAuthAndNavigate = function(targetUrl) {
            if (auth.currentUser) {
                window.location.href = targetUrl;
            } else {
                alert("กรุณาเข้าสู่ระบบก่อนเข้าชมหรือจัดการโปรไฟล์ครีเอเตอร์");
                window.location.href = "login.html";
            }
        };

        // ฟังก์ชันช่วยแปลง URL Google Drive ให้แสดงผลใน <img> ได้
        function convertDriveUrl(url) {
            if (!url || typeof url !== 'string') return '';
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/d/')) {
                    fileId = url.split('/d/')[1].split('/')[0].split('?')[0];
                } else if (url.includes('id=')) {
                    fileId = url.split('id=')[1].split('&')[0];
                }
                if (fileId) {
                    return `https://lh3.googleusercontent.com/d/${fileId}`;
                }
            }
            return url;
        }

        const btnToggleDropdown = document.getElementById('btn-toggle-dropdown');
        const userDropdownMenu = document.getElementById('user-dropdown-menu');
        const authGuest = document.getElementById('auth-guest');
        const authUser = document.getElementById('auth-user');
        const searchInput = document.getElementById('search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // 🎨 ระบบเปลี่ยนสไตล์ปุ่ม Filter เป็นสีส้มเมื่อถูกเลือก
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-orange-500', 'text-white', 'shadow-xs', 'shadow-orange-500/30', 'bg-blue-600', 'bg-blue-500');
                    b.classList.add('bg-slate-100', 'text-slate-700');
                });
                btn.classList.remove('bg-slate-100', 'text-slate-700');
                btn.classList.add('bg-orange-500', 'text-white', 'shadow-xs', 'shadow-orange-500/30');
            });
        });

        // 🔎 ระบบค้นหา
        searchInput?.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('#main-portfolio-grid > div');

            cards.forEach(card => {
                const cardText = card.textContent.toLowerCase();
                if (cardText.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // สลับเปิด-ปิด Dropdown โปรไฟล์
        btnToggleDropdown?.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdownMenu?.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!userDropdownMenu?.contains(e.target) && !btnToggleDropdown?.contains(e.target)) {
                userDropdownMenu?.classList.add('hidden');
            }
        });

        // ตรวจสอบ Auth State และดึงรูปโปรไฟล์
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authGuest?.classList.add('hidden');
                authUser?.classList.remove('hidden');

                const headerAvatar = document.getElementById('header-avatar');
                const dropdownAvatar = document.getElementById('dropdown-avatar');
                const dropdownName = document.getElementById('dropdown-user-name');
                const dropdownEmail = document.getElementById('dropdown-user-email');

                if (dropdownEmail) dropdownEmail.textContent = user.email || '';

                let displayName = user.displayName || user.email?.split('@')[0] || 'ผู้ใช้งาน';
                let avatarUrl = user.photoURL || '';

                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        displayName = data.name || data.displayName || data.username || displayName;
                        
                        avatarUrl = data.avatarBase64 || 
                                    data.photoURL || 
                                    data.avatar || 
                                    data.avatarUrl || 
                                    data.profileImage || 
                                    data.profileImg || 
                                    data.picture || 
                                    data.imageUrl || 
                                    avatarUrl;
                    }
                } catch (err) {
                    console.error("Error fetching user profile:", err);
                }

                if (dropdownName) dropdownName.textContent = displayName;

                const fallbackAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(displayName)}`;
                const finalAvatarSrc = avatarUrl ? convertDriveUrl(avatarUrl) : fallbackAvatar;

                if (headerAvatar) {
                    headerAvatar.src = finalAvatarSrc;
                    headerAvatar.onerror = () => { headerAvatar.src = fallbackAvatar; };
                }
                if (dropdownAvatar) {
                    dropdownAvatar.src = finalAvatarSrc;
                    dropdownAvatar.onerror = () => { dropdownAvatar.src = fallbackAvatar; };
                }
            } else {
                authGuest?.classList.remove('hidden');
                authUser?.classList.add('hidden');
            }
        });

        // ปุ่ม Sign Out
        document.getElementById('dropdown-logout')?.addEventListener('click', async () => {
            try {
                await signOut(auth);
                window.location.reload();
            } catch (err) {
                console.error("Logout error:", err);
            }
        });

        // ฟังก์ชันปิด Modal
        window.closePortfolioModal = function() {
            const modal = document.getElementById("portfolio-modal");
            const modalVideo = document.getElementById("modal-video");
            const modalIframe = document.getElementById("modal-iframe");

            if (modalVideo && typeof modalVideo.pause === 'function') modalVideo.pause();
            if (modalIframe) modalIframe.src = "";

            if (modal) {
                modal.classList.add("hidden");
                modal.style.display = "none";
            }
        };

        document.getElementById("modal-close-btn")?.addEventListener("click", window.closePortfolioModal);
        
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") window.closePortfolioModal();
        });
    </script>
</body>
</html>
